- name: "Security"
  code: "SEC"
  color: "#927878"
  icon: "shield-alt"
  description: "Managing and promoting product safety & security."
  tasks:
    - division: operations
      tasks:
        - "[vulnerability management](https://docs.mybb.com/1.8/development/security-workflow/)"
