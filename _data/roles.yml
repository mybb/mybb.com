  color: "#3aad3a"
  icon: "circle-nodes"
  description: "Supervising the MyBB Project and providing strategic direction."
  tasks:
    - division: Project
      tasks:
        - Project cohesion
        - products oversight
        - personnel management
    - division: legal & funding
      tasks:
        - legal issues
        - services, tools and subscriptions

- name: "Web"
  code: "WEB"
  color: "#2ba4eb"
