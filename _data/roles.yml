    - division: architecture
      tasks:
        - secure development practices
        - product safety oversight
    - division: development
      tasks:
        - security patch oversight
    - division: resources
      tasks:
        - security advisories
        - security-related resources
    - division: research
      tasks:
        - threat intelligence
        - security auditing & analysis
    - division: communication
      tasks:
        - security-related ecosystem cooperation
        - safety communication & promotion

- name: "Devops"
  code: "OPS"
  color: "#8967de"
  icon: "tools"
  description: "Sustaining development operations to deliver software efficiently."
  tasks:
    - division: operations
      tasks:
        - <abbr title="i.a. Issues, Pull Requests, branches">repository</abbr> maintenance
        - <abbr title="internal tracking, MyBB.com data files">product metadata</abbr> maintenance
        - "[release process](https://docs.mybb.com/1.8/development/release-workflow/) oversight"
        - package building
        - package distribution & availability
        - official container images
    - division: resources
      tasks:
        - development workflow & tools
    - division: communication
      tasks:
        - containers usage

- name: "SQA"
  code: "SQA"
